# 依存ライブラリを記述するファイル。
# "uv sync" を実行すると、pyproject.toml / uv.lock に基づいて .venv が同期される。

[project]
name = "stockhub-analytics"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "numpy",
    "pandas",
    "yfinance>=0.2.50",
]

[project.scripts]
stockhub-update-market-data = "engine.jobs.update_market_daily:main"

# 開発時にのみ使うライブラリ群
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
